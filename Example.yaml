title: Temperature Sensors

cards:

  - q: Which states disable temperature sensors?
    a:
      - Waiting
      - Idle
      - Running

  - q: Which state keeps temperature sensors enabled?
    a: Active

  - q: Which state consumes the least power?
    a: Idle

  - q: Which states permit DMA?
    a:
      - Active
      - Running

  - q: What is the default ADC resolution?
    a: 12 bits

  - q: Which interrupt indicates a conversion has completed?
    a: ADC Complete

  - q: Name the three states that disable the watchdog timer.
    a:
      - Waiting
      - Idle
      - Running